name: Sync status labels to project board

# The `status:` label is the ONE stored fact about a task's lifecycle. This workflow
# renders the two views of it: the board column, and the issue's open/closed state.
# Nothing here ever reads state as a fact or writes a label — that direction is what
# leaves a task contradicting itself with no view able to flag it.
#
# Labels and state are both read LIVE, never from the event payload. A payload is a
# snapshot from when the event fired, and one edit fires two events whose snapshots
# disagree; acting on one of them raced, failed, and produced the right answer by
# accident (#96).
#
# The status field is single-valued: more than one `status:` label FAILS the run.
# Relabel with one combined `gh issue edit --add-label X --remove-label Y`, which
# removes before it adds; two separate calls leave a real two-label window.
#
# Every value in .taskmd/config.md's status vocabulary has a branch below:
#   backlog (= no status: label) -> nothing at all: off the board, state untouched
#   needs spec / ready / in progress -> its column, and the issue OPEN
#   done -> Merged, and the issue CLOSED
#   cancelled -> removed from the board, and the issue CLOSED
#   anything else -> the run FAILS, naming the label
# The failure is the point. A value with no branch used to leave the target empty,
# which skipped the update step by its own `if:` and exited 0 — a silent no-op that
# looked exactly like a success while the card sat in the wrong column.
#
# Branches are ordered MOST TERMINAL FIRST, which is the tie-break when an issue
# carries more than one `status:` label. Two labels is a defect either way (#94).
#
# Closing an issue by hand no longer moves anything: the next label event renders
# state back from the label, reopening it if the label says the work is unfinished.
# To close an issue, set `status: done` (or `cancelled`). PRs use `Refs #N`, never
# `Closes #N` — that is GitHub closing an issue with no label write behind it.
#
# Two tokens, each doing what only it can:
#   ADD_TO_PROJECT_PAT — a classic PAT with the `project` scope, for the board.
#     GITHUB_TOKEN cannot write a user-owned Projects v2 board.
#   GITHUB_TOKEN — for closing/reopening. The PAT's `project` scope does not grant
#     issue writes, and events triggered by GITHUB_TOKEN start no new workflow run,
#     so the state step cannot loop.

on:
  issues:
    types: [labeled, unlabeled, reopened, closed]

permissions:
  contents: read
  issues: write   # the workflow renders issue state from the label (close / reopen)

# One label edit can fire two events (`--add-label X --remove-label Y` fires `labeled`
# AND `unlabeled`). Serialise them per issue so the second run reads the state the
# first one left, rather than racing it. Never cancel: each event carries a distinct
# label set and the later one holds the final truth.
concurrency:
  group: sync-status-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
      PROJECT_ID: PVT_kwHOBq4P884BbSJ7
      STATUS_FIELD_ID: PVTSSF_lAHOBq4P884BbSJ7zhWDtj0
      OPT_NEEDS_SPEC: "2a7723f0"
      OPT_READY: "812d008e"
      OPT_IN_PROGRESS: "ba2c97a3"
      OPT_MERGED: "6041979a"
      ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
      ISSUE_STATE: ${{ github.event.issue.state }}
      LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
    steps:
      - name: Determine target status option
        id: target
        # GITHUB_TOKEN: the PAT is `project`-scoped and cannot read issues.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Read labels LIVE, not from the event payload. One edit fires two events
          # whose payloads are snapshots taken at different moments — for a single
          # `gh issue edit --add-label X --remove-label Y` they read as "no status
          # label" and "X", and only the second is the answer. Deciding from the live
          # set makes both runs compute the same, final result, and means a transient
          # that has already resolved cannot fail the count below.
          labels=$(gh issue view "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" --json labels --jq '[.labels[].name] | @json')

          # The status field is single-valued. More than one label is not a fact, and
          # resolving it by precedence would put a finished task in the wrong column
          # behind a green run — the failure mode #72 removed for unknown values.
          status_count=$(printf '%s' "$labels" | grep -o 'status: [a-z ]*' | wc -l)
          if [ "$status_count" -gt 1 ]; then
            echo "::error::Issue #${{ github.event.issue.number }} carries $status_count status: labels — $labels. The status field holds one value. Fix with a single combined edit: gh issue edit N --add-label 'status: X' --remove-label 'status: Y' (which removes before it adds), not two separate calls."
            exit 1
          fi

          opt=""
          action="none"
          want_state="none"
          # Ordered MOST TERMINAL FIRST. With state no longer deciding anything, this
          # order is the only tie-break left when an issue carries more than one
          # `status:` label, and the advanced value should win. Two labels is still a
          # defect — #94 makes it fail outright.
          if printf '%s' "$labels" | grep -q 'status: cancelled'; then
            # Abandoned work leaves the board. It gets no column: adding one means
            # replacing the Status option set wholesale, which re-keys every option id
            # hard-coded here and in PROJECT_BOARD.md. Merged would misreport it.
            action="remove"; want_state="closed"
          elif printf '%s' "$labels" | grep -q 'status: done'; then
            opt="$OPT_MERGED"; want_state="closed"
          elif printf '%s' "$labels" | grep -q 'status: in progress'; then
            opt="$OPT_IN_PROGRESS"; want_state="open"
          elif printf '%s' "$labels" | grep -q 'status: ready'; then
            opt="$OPT_READY"; want_state="open"
          elif printf '%s' "$labels" | grep -q 'status: needs spec'; then
            opt="$OPT_NEEDS_SPEC"; want_state="open"
          elif printf '%s' "$labels" | grep -q 'status: '; then
            # A status: label this chain cannot express. Fail loudly — a silent no-op
            # is indistinguishable from a success, which is the bug this branch fixes.
            echo "::error::Unrecognised status label on issue #${{ github.event.issue.number }}: $labels. Every value in .taskmd/config.md's status vocabulary needs a branch in this workflow — add one, or the card silently stays where it was."
            exit 1
          fi
          # No status: label at all is NOT an error: on this repo that absence *is*
          # `backlog`, deliberately off the board (.taskmd/ADOPTION.md deviation 2).
          # It leaves action=none / want_state=none and every step below is skipped —
          # including the state step, so `backlog` never closes or reopens anything.
          if [ -n "$opt" ]; then action="set"; fi

          # State is RENDERED from the label, never read as a fact. Which state is
          # WANTED is decided here from labels; whether to act is decided in the state
          # step, against a live read — the payload's state is stale (see that step).
          echo "opt=$opt" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "want_state=$want_state" >> "$GITHUB_OUTPUT"
          echo "Issue #${{ github.event.issue.number }}: labels=$labels action=$action opt=${opt:-<none>} want=$want_state"

      - name: Remove issue from project
        if: steps.target.outputs.action == 'remove'
        run: |
          set -euo pipefail
          item_id=$(gh api graphql -f query='
            query($content:ID!) {
              node(id:$content) {
                ... on Issue {
                  projectItems(first:20) { nodes { id project { id } } }
                }
              }
            }' -f content="$ISSUE_NODE_ID" \
            --jq ".data.node.projectItems.nodes[] | select(.project.id == \"$PROJECT_ID\") | .id")

          if [ -z "$item_id" ]; then
            echo "Issue #${{ github.event.issue.number }} is not on the board — nothing to remove."
            exit 0
          fi

          gh api graphql -f query='
            mutation($project:ID!, $item:ID!) {
              deleteProjectV2Item(input:{projectId:$project, itemId:$item}) { deletedItemId }
            }' -f project="$PROJECT_ID" -f item="$item_id"

          echo "Removed issue #${{ github.event.issue.number }} from the board (status: cancelled)."

      - name: Add issue to project and set Status
        if: steps.target.outputs.action == 'set'
        run: |
          set -euo pipefail
          item_id=$(gh api graphql -f query='
            mutation($project:ID!, $content:ID!) {
              addProjectV2ItemById(input:{projectId:$project, contentId:$content}) {
                item { id }
              }
            }' -f project="$PROJECT_ID" -f content="$ISSUE_NODE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($project:ID!, $item:ID!, $field:ID!, $opt:String!) {
              updateProjectV2ItemFieldValue(input:{
                projectId:$project, itemId:$item, fieldId:$field,
                value:{ singleSelectOptionId:$opt }
              }) { projectV2Item { id } }
            }' -f project="$PROJECT_ID" -f item="$item_id" \
               -f field="$STATUS_FIELD_ID" -f opt="${{ steps.target.outputs.opt }}"

          echo "Set issue #${{ github.event.issue.number }} -> option ${{ steps.target.outputs.opt }}"

      - name: Render issue state from the label
        if: steps.target.outputs.want_state != 'none'
        # GITHUB_TOKEN, not the PAT, and deliberately so:
        #   1. ADD_TO_PROJECT_PAT is documented as a classic PAT with the `project`
        #      scope, which does not grant issue writes. `gh issue close` under it
        #      would fail the first time anyone set `status: done`.
        #   2. GitHub does not start workflow runs from events triggered by
        #      GITHUB_TOKEN, so closing here produces no second run. Under a PAT it
        #      would produce one (idempotent, but noise).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          want="${{ steps.target.outputs.want_state }}"

          # Read state LIVE, not from the event payload. `gh issue edit --add-label X
          # --remove-label Y` fires two events whose payloads BOTH say the old state,
          # so both runs would decide to act, one would win, and the other would fail
          # with "Could not close the issue" having achieved the right outcome. The
          # payload describes the issue as it was when the event fired; by now a
          # sibling run may have changed it. `concurrency` above serialises the pair
          # so this read happens after the other run has finished, not beside it.
          current=$(gh issue view "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" --json state --jq '.state' | tr '[:upper:]' '[:lower:]')

          if [ "$current" = "$want" ]; then
            echo "#${{ github.event.issue.number }} is already $want — nothing to do."
            exit 0
          fi

          if [ "$want" = "closed" ]; then
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
            echo "Closed #${{ github.event.issue.number }} — its label says the work is finished."
          else
            gh issue reopen "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
            echo "Reopened #${{ github.event.issue.number }} — its label says the work is not finished."
          fi
